name: Documentation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown links and structure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/docs/requirements.txt
      - name: Install Markdown parser
        run: python -m pip install -r scripts/docs/requirements.txt
      - name: Check the checker
        run: python -m unittest discover -s scripts/docs -p 'test_*.py'
      - name: Check all repository Markdown
        run: make docs-check PYTHON=python
