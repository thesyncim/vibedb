name: durable RF3 external process

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: durable-rf3-external-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qualify:
    name: Ubuntu external RF3 recovery (count=3)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Prepare bounded qualification evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/durable-rf3-external"
          test_root="${RUNNER_TEMP}/durable-rf3-external-tmp"
          mkdir -p "${evidence}" "${test_root}"
          git rev-parse HEAD > "${evidence}/revision.txt"
          go version > "${evidence}/go-version.txt"
          go env GOOS GOARCH GOVERSION GOTOOLCHAIN > "${evidence}/go-env.txt"
          uname -a > "${evidence}/uname.txt"
          df -T -B1 "${test_root}" > "${evidence}/filesystem.txt"
          stat -f -c 'filesystem_type=%T block_size=%S' "${test_root}" >> "${evidence}/filesystem.txt"
          command -v fallocate > "${evidence}/fallocate-path.txt"
          fallocate --version > "${evidence}/fallocate-version.txt"
          preflight="${test_root}/strict-allocation-preflight"
          fallocate -l 1048576 "${preflight}"
          sync "${preflight}"
          stat -c 'size=%s blocks=%b block_size=%B' "${preflight}" > "${evidence}/allocation.txt"
          test "$(stat -c %s "${preflight}")" -eq 1048576
          test "$(( $(stat -c %b "${preflight}") * $(stat -c %B "${preflight}") ))" -ge 1048576
          rm -f "${preflight}"
          test_name='TestGatewayDurableRF3ExternalProcessRecovery'
          go test -list "^${test_name}$" ./cmd/vibedb-gateway > "${evidence}/test-list.txt"
          grep -Fqx "${test_name}" "${evidence}/test-list.txt"
          printf 'TMPDIR=%s VIBEDB_DURABLE_RF3_PROCESS_E2E=1 go test -json -count=3 -timeout=18m -run %s ./cmd/vibedb-gateway\n' \
            "${test_root}" "^${test_name}$" > "${evidence}/command.txt"
      - name: Run external RF3 terminal and ACK recovery
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}/durable-rf3-external-tmp
          VIBEDB_DURABLE_RF3_PROCESS_E2E: "1"
        run: |
          set -euo pipefail
          go test -json -count=3 -timeout=18m \
            -run '^TestGatewayDurableRF3ExternalProcessRecovery$' \
            ./cmd/vibedb-gateway \
            | tee "${RUNNER_TEMP}/durable-rf3-external/go-test.jsonl"
      - name: Validate exact no-skip evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/durable-rf3-external"
          result="${evidence}/go-test.jsonl"
          test_name='TestGatewayDurableRF3ExternalProcessRecovery'
          test -s "${result}"
          test "$(stat -c %s "${result}")" -le 67108864
          test "$(jq -r --arg test_name "${test_name}" \
            'select(.Action == "pass" and .Test == $test_name) | .Test' \
            "${result}" | wc -l)" -eq 3
          if jq -e --arg test_name "${test_name}" \
            'select(.Action == "skip" and .Test == $test_name)' \
            "${result}" >/dev/null; then
            echo "external durable RF3 qualification skipped" >&2
            exit 1
          fi
          test "$(jq -r --arg test_name "${test_name}" \
            'select(.Action == "output" and .Test == $test_name and
              (.Output | contains("durable external RF3:") and
                contains("roles=4") and
                contains("shard_processes=3") and
                contains("gateway_replacement=true") and
                contains("gateway_principals_distinct=true") and
                contains("mtls=true") and
                contains("shard_sigstop=true") and
                contains("shard_sigkill=true") and
                contains("all_shards_restarted=true") and
                contains("terminal_response_lost=true") and
                contains("ack_response_lost=true") and
                contains("exact_terminal_replay=true") and
                contains("exact_ack_replay=true") and
                contains("acknowledged_replay_refused=true") and
                contains("no_acknowledged_loss=true") and
                contains("partition_failover=") and
                contains("terminal_failover=") and
                contains("ack_failover=") and
                contains("gateway_replacement_recovery=") and
                contains("max_voter_failover=") and
                contains("p99=") and
                contains("rss_growth=") and
                contains("storage_growth=") and
                contains("wal_growth=") and
                contains("public_client_wire_bytes=") and
                contains("snapshot_payload_bytes=") and
                contains("ack_gc_complete=true") and
                contains("pin_journals_retired=true"))) | .Test' \
            "${result}" | wc -l)" -eq 3
          printf 'schema\tvibedb.durable-rf3-external-process\t1\nresult\tpass\nrevision\t%s\nruns\t3\n' \
            "$(cat "${evidence}/revision.txt")" > "${evidence}/summary.tsv"
          test "$(stat -c %s "${evidence}/summary.tsv")" -le 65536
      - name: Upload bounded external RF3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: durable-rf3-external-${{ github.sha }}
          path: ${{ runner.temp }}/durable-rf3-external
          if-no-files-found: error
          retention-days: 30
