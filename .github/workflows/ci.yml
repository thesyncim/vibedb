name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    name: test (${{ matrix.runner }})
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Build and vet
        run: go build ./... && go vet ./...
      - name: Cross-compile 32-bit packages and tests
        if: matrix.runner == 'ubuntu-latest'
        env:
          CGO_ENABLED: 0
        run: |
          GOOS=linux GOARCH=386 go test -run '^$' -exec=true ./...
          GOOS=windows GOARCH=386 go test -run '^$' -exec=true ./...
          (cd integration/pgclient && GOOS=linux GOARCH=386 go test -run '^$' -exec=true ./...)
          (cd integration/pgclient && GOOS=windows GOARCH=386 go test -run '^$' -exec=true ./...)
      - name: Tests
        # Durable-backed package tests reserve large mmap arenas. Serializing
        # package binaries keeps the aggregate virtual-memory reservation
        # deterministic without reducing test coverage or per-package timeouts.
        run: go test -p=1 -timeout=25m ./...
      - name: RF3 external-process fault evidence
        if: matrix.runner == 'ubuntu-latest'
        run: |
          rf3_evidence_path="${RUNNER_TEMP}/rf3-chaos.tsv"
          go run ./bench/rf3chaos -output "${rf3_evidence_path}" -runs 1 -timeout 5m
          test -s "${rf3_evidence_path}"
          grep -F $'schema\tvibedb.rf3.chaos-evidence\t2' "${rf3_evidence_path}"
          grep -F $'summary\tpassed\t1\tfailed\t0' "${rf3_evidence_path}"
          sed -n '1,50p' "${rf3_evidence_path}"
      - name: PostgreSQL client integration
        if: matrix.runner == 'ubuntu-latest'
        working-directory: integration/pgclient
        run: go test -timeout=2m ./...
      - name: PostgreSQL psql 18.4 integration
        if: matrix.runner == 'ubuntu-latest'
        working-directory: integration/pgclient
        env:
          VIBEDB_TEST_PSQL: "1"
        run: go test -count=1 -timeout=5m -run '^TestPSQLClient18$' -v .
      - name: Race, storage suites
        # Qualification tests build multi-hundred-MiB corpora and are geometry/
        # throughput gates; under -race on ARM they alone can exhaust the budget.
        run: go test -race -timeout=25m -skip 'Qualification' -run 'Primary|BufferedInplace|Committer|PageCache|WriteTransaction' ./internal/storeio/ ./store/durable/
  lateral-race:
    name: race (LATERAL cross-layer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Focused LATERAL race tests
        run: go test -race -p=1 -count=1 -timeout=10m -run 'Lateral' ./query ./sql/driver ./pgwire
