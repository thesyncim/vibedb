name: packed read throughput
on:
  pull_request:
    paths:
      - 'internal/storeio/compact_primary_scan*.go'
      - 'internal/storeio/compact_stream_codec.go'
      - 'store/durable/store_file_parallel_scan_bench_test.go'
      - 'store/durable/store_file_high_cardinality_point_bench_test.go'
      - '.github/workflows/packed-read-throughput.yml'
permissions:
  contents: read
concurrency:
  group: packed-read-throughput-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  GOEXPERIMENT: simd
jobs:
  compare:
    name: packed reads (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build both revisions before timing
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/packed-read-results"
          git worktree add --detach "$RUNNER_TEMP/packed-read-base" "$BASE_SHA"
          # Compare the PR test merge with its base, including concurrent main
          # changes in both sides. The benchmark harness is identical.
          cp store/durable/store_file_parallel_scan_bench_test.go "$RUNNER_TEMP/packed-read-base/store/durable/"
          cp store/durable/store_file_high_cardinality_point_bench_test.go "$RUNNER_TEMP/packed-read-base/store/durable/"
          go test -c ./store/durable -o "$RUNNER_TEMP/packed-read-head.test"
          (cd "$RUNNER_TEMP/packed-read-base" && go test -c ./store/durable -o "$RUNNER_TEMP/packed-read-base.test")
          {
            echo "base=$BASE_SHA merge=$HEAD_SHA pr_head=$PR_HEAD_SHA runner=${{ matrix.os }}"
            go version
            uname -a
            lscpu
            free -b
            df -T "$RUNNER_TEMP"
            sha256sum go.mod go.sum internal/benchcorpus/corpus.go store/durable/store_file_parallel_scan_bench_test.go store/durable/store_file_high_cardinality_point_bench_test.go
          } > "$RUNNER_TEMP/packed-read-results/provenance.txt"
      - name: Serial full-byte comparisons
        run: |
          set -euo pipefail
          # Ten repetitions per revision in ABBA order. No concurrent builds or
          # tests. Times are observations, never a CI speed threshold.
          for revision in base head head base; do
            "$RUNNER_TEMP/packed-read-$revision.test" \
              -test.run '^$' \
              -test.bench '^(BenchmarkUnifiedPartitionedScanAllBytes(Million|HighCardinality)?|BenchmarkUnifiedGetRawHighCardinalityAllBytes)$/workers=(1|4)$' \
              -test.benchtime=300ms -test.count=5 \
              | tee -a "$RUNNER_TEMP/packed-read-results/$revision.txt"
          done
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: packed-read-throughput-${{ matrix.os }}
          path: ${{ runner.temp }}/packed-read-results/
          retention-days: 90
